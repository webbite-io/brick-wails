<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/fonts.css"/>
    <link rel="preload" href="/fonts/roboto-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="stylesheet" href="/style.css"/>
    <link rel="stylesheet" href="/startup.css"/>
    <title>Webbite Brick</title>
</head>
<body>
<main class="startup-panel" id="startup-panel">
    <div class="brand">
        <div class="brand-logo-wrap">
            <img class="brand-logo" src="/appicon.png" alt=""/>
            <!-- Orbiting blurred dot: a one-shot shimmer over the logo (welcome only). -->
            <span class="brand-shimmer" aria-hidden="true"></span>
        </div>
        <h1 class="brand-title">Webbite Brick</h1>
        <p class="brand-subtitle">Storage for all your devices</p>
    </div>

    <div class="status-indicator" id="status-indicator">
        <span class="spinner" id="stage-spinner"></span>
        <span class="status-icon" id="stage-icon"></span>
        <div class="status-text">
            <p class="status-title" id="stage-title"></p>
            <p class="status-message" id="stage-message"></p>
        </div>
    </div>

    <p class="startup-detail" id="stage-detail"></p>

    <!-- Completed onboarding steps (brick-cli's numbered ✅ checklist). -->
    <ol class="checks-list" id="checklist"></ol>

    <!-- Per-step form: options, inputs, links. Filled by startup.ts. -->
    <section class="step-body" id="step-body"></section>

    <footer class="startup-actions" id="startup-actions">
        <button id="primary-btn" class="btn"></button>
        <button id="secondary-btn" class="btn"></button>
    </footer>
</main>

<script type="module" src="/src/startup.js"></script>
</body>
</html>
