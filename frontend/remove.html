<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/fonts.css"/>
    <link rel="preload" href="/fonts/roboto-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="stylesheet" href="/style.css"/>
    <link rel="stylesheet" href="/startup.css"/>
    <title>Webbite Brick</title>
</head>
<body>
<!-- The setup window's layout (startup.css) without the wizard's step dots:
     one question, asked when a remote control folder's "Remove…" is picked
     in the tray. -->
<main class="startup-panel ready">
    <div class="brand">
        <div class="brand-logo-wrap">
            <img class="brand-logo" src="/appicon.png" alt=""/>
        </div>
        <h1 class="brand-title">Webbite Brick</h1>
        <p class="brand-subtitle">Storage for all your devices</p>
    </div>

    <div class="status-indicator">
        <span class="status-icon visible icon-warn">!</span>
        <div class="status-text">
            <p class="status-title">Remote Control</p>
            <p class="status-message">Do you want to delete the currently shared folder?</p>
        </div>
    </div>

    <p class="startup-detail" id="remove-error"></p>

    <footer class="startup-actions nav">
        <button id="cancel-btn" class="btn btn-quiet btn-cta visible">Cancel</button>
        <button id="delete-btn" class="btn btn-primary btn-cta visible">Delete</button>
    </footer>
</main>

<script type="module" src="/src/remove.js"></script>
</body>
</html>
