version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_CERTIFICATE: "path/to/certificate.pfx"
  # SIGN_THUMBPRINT: "certificate-thumbprint"  # Alternative to SIGN_CERTIFICATE
  # TIMESTAMP_SERVER: "http://timestamp.digicert.com"
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      # Default to CGO_ENABLED=0 if not explicitly set
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui {{.BRICK_LDFLAGS}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - rm -f *.syso
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the application
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else}}create:nsis:installer{{end}}'
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'"
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  # Stages an MSIX package layout and, where makeappx is available, packs it.
  #
  # This deliberately does not use `wails3 tool msix`: that subcommand does not
  # exist in the wails3 version this module pins (v3.0.0-alpha2.113 — check
  # `wails3 tool` for the current list), and the invocation it replaced also
  # pointed `--config` at a wails.json this project does not have, since it
  # configures through build/config.yml. Both failed before reaching a compiler.
  #
  # Driven by `make package-windows-msix`, which computes MSIX_VERSION from the
  # git tag and passes MSIX_PUBLISHER through. Staging runs on any OS; packing
  # needs makeappx.exe from the Windows SDK, so the usual split is to stage on
  # the build host and pack on Windows (or in a Windows CI job) against the
  # staged directory this leaves behind.
  create:msix:package:
    summary: Stages an MSIX layout (and packs it when makeappx is present)
    deps:
      - task: build
    preconditions:
      - sh: test -n '{{.MSIX_PUBLISHER}}'
        msg: |
          MSIX_PUBLISHER is required and must match the publisher ID that
          Partner Center assigns your account, e.g.
            make package-windows-msix MSIX_PUBLISHER='CN=1234ABCD-…'
          Find it in Partner Center under Account settings → Identity details
          ("Package/Identity/Publisher"). A mismatch is rejected at ingestion.
      - sh: test -n '{{.MSIX_VERSION}}'
        msg: "MSIX_VERSION is required (four parts, e.g. 1.2.3.0). Use `make package-windows-msix`, which derives it from the git tag."
      - sh: command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1
        msg: "ImageMagick is required to generate the MSIX logo assets from build/appicon.png. Install it (Debian/Ubuntu: sudo apt install imagemagick)."
    cmds:
      - task: generate:msix:assets
        vars:
          STAGE: '{{.STAGE}}'
      - |
        set -euo pipefail
        STAGE='{{.STAGE}}'

        # AppxManifest.xml from the checked-in template. ProcessorArchitecture
        # takes MSIX's spelling (x64), not Go's (amd64).
        sed -e 's|__MSIX_PUBLISHER__|{{.MSIX_PUBLISHER}}|g' \
            -e 's|__MSIX_VERSION__|{{.MSIX_VERSION}}|g' \
            -e 's|__MSIX_ARCH__|{{.MSIX_ARCH}}|g' \
            '{{.ROOT_DIR}}/build/windows/msix/app_manifest.xml' > "$STAGE/AppxManifest.xml"

        cp '{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe' "$STAGE/{{.APP_NAME}}.exe"
        echo "Staged MSIX layout: $STAGE"
      - |
        set -euo pipefail
        STAGE='{{.STAGE}}'
        OUT='{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix'
        if command -v makeappx >/dev/null 2>&1 || command -v makeappx.exe >/dev/null 2>&1; then
          makeappx pack /d "$STAGE" /p "$OUT" /o
          echo "Packed: $OUT"
          echo "Submit this to Partner Center — it re-signs the package, so no code-signing certificate is needed for the Store."
          echo "To install it locally for testing, sign it first: wails3 task windows:sign:msix"
        else
          echo ""
          echo "makeappx not found, so the package was staged but not packed."
          echo "Pack it on Windows (makeappx ships with the Windows 10/11 SDK):"
          echo "  makeappx pack /d $STAGE /p $OUT /o"
        fi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      # MSIX names x86_64 "x64"; Go calls it amd64. arm64 is spelled the same.
      MSIX_ARCH: '{{if eq (.ARCH | default ARCH) "arm64"}}arm64{{else}}x64{{end}}'
      STAGE: '{{.ROOT_DIR}}/{{.BIN_DIR}}/msix/{{.ARCH | default ARCH}}'
      MSIX_PUBLISHER: '{{.MSIX_PUBLISHER | default ""}}'
      MSIX_VERSION: '{{.MSIX_VERSION | default ""}}'

  # The five logos AppxManifest.xml references, derived from the 1024x1024
  # build/appicon.png so there is one source of truth for the app's icon.
  # Square150x150Logo and Square44x44Logo are what Windows actually shows in
  # the Start menu and taskbar; the rest are Store/tile furniture.
  generate:msix:assets:
    summary: Generates the MSIX logo assets from build/appicon.png
    internal: true
    cmds:
      - |
        set -euo pipefail
        STAGE='{{.STAGE}}'
        SRC='{{.ROOT_DIR}}/build/appicon.png'
        IM=magick; command -v magick >/dev/null 2>&1 || IM=convert

        rm -rf "$STAGE"
        mkdir -p "$STAGE/Assets"

        # Square logos scale directly. The wide tile and splash screen have a
        # non-square aspect, so the icon is fitted to the short edge and then
        # centred on a transparent canvas rather than stretched.
        "$IM" "$SRC" -resize 50x50       "$STAGE/Assets/StoreLogo.png"
        "$IM" "$SRC" -resize 150x150     "$STAGE/Assets/Square150x150Logo.png"
        "$IM" "$SRC" -resize 44x44       "$STAGE/Assets/Square44x44Logo.png"
        "$IM" "$SRC" -resize x150 -background none -gravity center -extent 310x150 "$STAGE/Assets/Wide310x150Logo.png"
        "$IM" "$SRC" -resize x300 -background none -gravity center -extent 620x300 "$STAGE/Assets/SplashScreen.png"

  # Signing an MSIX is only needed to install it outside the Store (local
  # testing, or sideloading). A Store submission is re-signed by Microsoft.
  sign:msix:
    summary: Signs a staged .msix for local installation or sideloading
    desc: |
      Store submissions do NOT need this — Partner Center re-signs the package.
      Use it to install the .msix on your own machine, where Windows refuses an
      unsigned package. The certificate's subject must equal the manifest's
      Publisher, so a self-signed test certificate means staging with
      MSIX_PUBLISHER set to that certificate's subject.
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    desc: |
      Signs the .exe with an Authenticode certificate.
      Set SIGN_CERTIFICATE or SIGN_THUMBPRINT to override the certificate
      configured globally via `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: build
    cmds:
      # Certificate vars are optional: if unset, `wails3 tool sign` falls back to
      # the certificate configured globally via `wails3 setup`.
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}}

  sign:installer:
    summary: Signs the NSIS installer
    desc: |
      Creates and signs the NSIS installer.
      Set SIGN_CERTIFICATE or SIGN_THUMBPRINT to override the certificate
      configured globally via `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:nsis:installer
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    cmds:
      - wails3 tool sign --input "build/windows/nsis/{{.APP_NAME}}-installer.exe" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}}
