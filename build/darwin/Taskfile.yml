version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross
  # The .app bundles' file name. macOS shows an app by its bundle's file name
  # (Finder, Dock, Cmd-Tab), not by CFBundleName, so this is the name users
  # see. The dev bundle gets the same name in its own directory rather than a
  # ".dev" suffix, which would be shown too.
  BUNDLE_NAME: 'Webbite Brick'
  # Sparkle, the updater (see updates_darwin.go). The release tarball is
  # fetched by the `sparkle` task and unpacked to SPARKLE_DIR (gitignored):
  # the framework is linked at build time and embedded in the bundle, and its
  # bin/ tools sign updates at release time (build/darwin/release.sh). Bump
  # both together: SPARKLE_SHA256 is the tarball's checksum.
  SPARKLE_VERSION: '2.10.0'
  SPARKLE_SHA256: 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c'
  SPARKLE_DIR: 'build/darwin/sparkle'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: sparkle
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s {{.BRICK_LDFLAGS}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: sparkle
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle


  sparkle:
    summary: Downloads the pinned Sparkle release into build/darwin/sparkle
    status:
      - test "$(cat {{.SPARKLE_DIR}}/.version 2>/dev/null)" = "{{.SPARKLE_VERSION}}"
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d)
        curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/{{.SPARKLE_VERSION}}/Sparkle-{{.SPARKLE_VERSION}}.tar.xz" -o "$tmp/sparkle.tar.xz"
        if command -v sha256sum >/dev/null 2>&1; then
          sum=$(sha256sum "$tmp/sparkle.tar.xz" | awk '{print $1}')
        else
          sum=$(shasum -a 256 "$tmp/sparkle.tar.xz" | awk '{print $1}')
        fi
        if [ "$sum" != "{{.SPARKLE_SHA256}}" ]; then
          rm -rf "$tmp"
          echo "Sparkle {{.SPARKLE_VERSION}} checksum mismatch: got $sum, want {{.SPARKLE_SHA256}}" >&2
          exit 1
        fi
        rm -rf "{{.SPARKLE_DIR}}"
        mkdir -p "{{.SPARKLE_DIR}}"
        tar -xJf "$tmp/sparkle.tar.xz" -C "{{.SPARKLE_DIR}}" Sparkle.framework bin
        rm -rf "$tmp"
        echo "{{.SPARKLE_VERSION}}" > "{{.SPARKLE_DIR}}/.version"

  create:app:bundle:
    summary: Creates an `.app` bundle
    deps:
      - task: sparkle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/MacOS"
      # A fresh copy each time: a framework left from an older Sparkle would
      # keep files the new one doesn't have. ditto (or cp -a) rather than
      # cp -R, which would flatten the framework's Versions/Current symlinks
      # and break its signature.
      - rm -rf "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Frameworks"
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Frameworks"
      - '{{if eq OS "darwin"}}ditto{{else}}cp -a{{end}} "{{.SPARKLE_DIR}}/Sparkle.framework" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Frameworks/Sparkle.framework"'
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents"
      - task: stamp:plist
        vars:
          PLIST: '{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Info.plist'
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  stamp:plist:
    summary: Writes the build's version and Sparkle settings into a bundle's Info.plist
    internal: true
    platforms: [darwin]
    cmds:
      - |
        set -eu
        plist="{{.PLIST}}"
        # Sparkle decides whether an appcast item is newer by comparing its
        # sparkle:version with CFBundleVersion, so a release bundle has to
        # carry the release's version. Dev builds keep the placeholder.
        v="{{.BRICK_VERSION}}"
        if [ -n "$v" ] && [ "$v" != "dev" ]; then
          plutil -replace CFBundleVersion -string "$v" "$plist"
          plutil -replace CFBundleShortVersionString -string "$v" "$plist"
        fi
        # The key updates are verified against. Without it Sparkle refuses to
        # start, and the app runs without updates (the reason is logged).
        if [ -n "${SPARKLE_PUBLIC_ED_KEY:-}" ]; then
          plutil -replace SUPublicEDKey -string "$SPARKLE_PUBLIC_ED_KEY" "$plist"
        fi
        # Test builds only: point Sparkle at another appcast, a local one say.
        if [ -n "${SPARKLE_FEED_URL:-}" ]; then
          plutil -replace SUFeedURL -string "$SPARKLE_FEED_URL" "$plist"
        fi

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      # Inside out rather than --deep, which Sparkle's helpers don't survive;
      # release builds are signed the same way with a Developer ID
      # (build/darwin/release.sh).
      - build/darwin/sign.sh "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    cmds:
      - mkdir -p "{{.BIN_DIR}}/dev/{{.BUNDLE_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/dev/{{.BUNDLE_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/dev/{{.BUNDLE_NAME}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/dev/{{.BUNDLE_NAME}}.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/dev/{{.BUNDLE_NAME}}.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/dev/{{.BUNDLE_NAME}}.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/dev/{{.BUNDLE_NAME}}.app"
      - '"{{.BIN_DIR}}/dev/{{.BUNDLE_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"'
